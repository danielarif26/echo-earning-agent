name: penniless-agent-watcher

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: penniless-agent-watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run read-only watcher
        env:
          EVM_WALLET: ${{ vars.EVM_WALLET }}
          SOL_WALLET: ${{ vars.SOL_WALLET }}
          SUPERTEAM_API_KEY: ${{ secrets.SUPERTEAM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node agent.mjs

      - name: Commit watcher state
        run: |
          git config user.name "penniless-agent-watcher"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add status.md history.jsonl seen-listings.json NOTIFY.txt 2>/dev/null || true
          git add -u
          git diff --staged --quiet || git commit -m "status @ $(date -u +%FT%TZ)"
          git push

      - name: Alert owner on verified payment
        if: always()
        run: |
          if [ -f NOTIFY.txt ]; then
            echo "::error title=PAYMENT RECEIVED::$(cat NOTIFY.txt)"
            exit 1
          fi
          echo "no verified payment event this run"
